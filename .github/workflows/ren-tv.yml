
name: REN TV Automatic Programming

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ren-tv-update
  cancel-in-progress: false

jobs:
  update-ren-tv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout REN website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update REN TV channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_ren_tv.py

      - name: Save updated programming
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ren-tv.json
          if ! git diff --cached --quiet; then
            git commit -m "Update REN TV programming"
            git push
          fi
